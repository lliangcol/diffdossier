name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  GO_VERSION: "1.25.12"
  GOTOOLCHAIN: local
  GOWORK: "off"
  GOFLAGS: -mod=readonly

jobs:
  native:
    name: Release native (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-amd64
            runner: ubuntu-24.04
            race: true
          - label: windows-amd64
            runner: windows-2025
            race: true
          - label: macos-amd64
            runner: macos-15-intel
            race: true
          - label: macos-arm64
            runner: macos-15
            race: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Test
        run: go test -count=1 ./...
      - name: Race test
        if: matrix.race
        run: go test -race -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Platform compatibility spike
        run: go run ./spikes/platform

  publish:
    name: Build, attest, and publish
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Build deterministic release set
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: go run ./cmd/releaseprep build --repo . --output dist --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT"
      - name: Verify checksums and native installation
        run: go run ./cmd/releaseprep verify --dir dist --smoke
      - name: Attest archives with SPDX SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-checksums: dist/SHA256SUMS
          sbom-path: dist/diffdossier.spdx.json
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --generate-notes \
            --title "DiffDossier $RELEASE_VERSION"
