schema_version = 1
baseline = "refs/remotes/origin/main"
include_untracked = true
include_ignored = []

[review]
max_files_per_task = 8
max_packet_bytes = 250000
default_provider = "manual"

[state]
retention_days = 30

[risk]
policy_files = []

[[gates]]
id = "unit-test"
argv = ["go", "test", "./..."]
cwd = "."
env_allowlist = ["PATH", "GOCACHE"]
when_paths = ["**/*.go", "go.mod", "go.sum"]
depends_on = []
timeout_seconds = 900
resource_class = "cpu"
blocking = true
cache_class = "worktree_deterministic"
final_always = true
network_class = "none"
expected_writes = []
redaction_policy = "test-output"
